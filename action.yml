name: "monad-foundry-toolchain"
description: "Install Monad Foundry"
author: "Category Labs"
branding:
  color: "gray-dark"
  icon: "play-circle"

inputs:
  version:
    default: "stable-monad"
    description: |
      Foundry version to install. Passed to `foundryup --install <version>`.

      This version number has to match a released version of Monad Foundry.
      The default value is `stable-monad`, which will pull the latest stable Monad build.
      Other options include `nightly` or a specific version.
      For standard Foundry, use `stable`, `rc`, or a specific version like `v1.3.6`.
    required: false
  network:
    default: "monad"
    description: |
      Network to install Foundry for. Passed to `foundryup --network <network>`.

      This can be `monad`, `ethereum`, or `tempo`. The default value is `monad`.
    required: false
  cache:
    default: "true"
    description: |
      Whether to cache Foundry data or not.

      Caching is activated by default.
    required: false
  cache-key:
    default: "${{ github.job }}-${{ github.sha }}"
    description: |
      A custom cache key to use.

      This key is used to identify the cache. If not provided, a default key consisting of the job id and the commit hash is used.
    required: false
  cache-restore-keys:
    default: |-
      ${{ github.job }}-
    description: |
      Custom cache restore keys to use.

      This key is used to identify the cache to restore. If not provided, a default key consisting of the job id is used.
    required: false

runs:
  using: "node24"
  main: "dist/index.js"
  post: "dist/save/index.js"
  post-if: success()
